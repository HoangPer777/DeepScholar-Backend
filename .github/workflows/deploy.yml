name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/deepscholar-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/deepscholar-backend:latest

            docker stop deepscholar-backend || true
            docker rm deepscholar-backend || true

            docker run -d \
              --name deepscholar-backend \
              --restart unless-stopped \
              --memory 400m \
              -p 8000:8000 \
              -e DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
              -e DJANGO_DEBUG=false \
              -e DJANGO_ALLOWED_HOSTS="${{ secrets.DJANGO_ALLOWED_HOSTS }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e REDIS_URL="${{ secrets.REDIS_URL }}" \
              -e INTERNAL_SERVICE_KEY="${{ secrets.INTERNAL_SERVICE_KEY }}" \
              -e CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
              -e CSRF_TRUSTED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
              -e FRONTEND_URL="https://deep-scholar-hoangphan.vercel.app" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e AWS_ENDPOINT_URL="${{ secrets.AWS_ENDPOINT_URL }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_STORAGE_BUCKET_NAME="${{ secrets.AWS_STORAGE_BUCKET_NAME }}" \
              -e AWS_S3_REGION_NAME="${{ secrets.AWS_S3_REGION_NAME }}" \
              -e AWS_PUBLIC_URL="${{ secrets.AWS_PUBLIC_URL }}" \
              -e AI_SERVICE_URL="http://localhost:8001/api" \
              ${{ secrets.DOCKER_USERNAME }}/deepscholar-backend:latest

            docker exec deepscholar-backend python manage.py migrate --noinput
