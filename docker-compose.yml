services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: deepscholar-backend
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=true
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend,host.docker.internal,172.17.0.1
      - CSRF_TRUSTED_ORIGINS=http://localhost:3000
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
